kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: order-platform
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30081
        hostPort: 30081
      - containerPort: 30082
        hostPort: 30082
