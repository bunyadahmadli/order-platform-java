apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: order-platform
resources:
  - namespace.yaml
  - config.yaml
  - infrastructure.yaml
  - order-service.yaml
  - inventory-service.yaml
images:
  - name: order-platform/order-service
    newName: localhost:8083/order-platform/order-service
    newTag: latest
  - name: order-platform/inventory-service
    newName: localhost:8083/order-platform/inventory-service
    newTag: latest
