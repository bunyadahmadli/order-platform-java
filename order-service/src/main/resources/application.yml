spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5434/orders
    username: orders
    password: orders
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

outbox:
  publish-interval: 1000
  batch-size: 100
